    </div>
    <div class="grid grid-cols-3 gap-y-5 gap-x-2 text-center text-xs">
        <!-- เมนูพื้นฐาน -->
        <div class="flex flex-col items-center gap-2 cursor-pointer hover:opacity-70 transition-opacity">
            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center text-xl shadow-sm border border-red-100"><i class="fa-solid fa-clock-rotate-left"></i></div>
            <span class="text-gray-600 font-medium">ประวัติย้อนหลัง</span>
        </div>
        <div class="flex flex-col items-center gap-2 cursor-pointer hover:opacity-70 transition-opacity">

        </div>

        <!-- Admin Menu (Hidden by default, shown via JS if user is Admin) -->
        <div id="menuAdminLog" class="hidden flex-col items-center gap-2 cursor-pointer hover:opacity-70 transition-opacity">

            <span class="text-gray-600 font-medium">ตรวจคูปอง</span>

</div>

<!-- My Coupons Section (Hidden by default) -->

    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 to-red-600"></div>
    <div class="flex justify-between items-center mb-4 mt-1">
        <h3 class="font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-ticket text-red-600"></i> คูปองของฉัน (พร้อมใช้)
        </h3>

    <div id="couponList" class="space-y-3">

                    <p class="font-bold text-sm text-gray-800">Starbucks 200฿</p>
                    <p class="text-[10px] text-gray-500 mt-0.5">รหัส: CPN-001</p>
                </div>
            </div>
            <button onclick="useCoupon('CPN-001')" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md hover:bg-red-700 active:scale-95 transition-all">
                ใช้สิทธิ์
            </button>
        </div>
    </div>
</div>

<!-- Bottom Navigation -->

    <!-- Scan Button Center -->
    <div class="relative flex flex-col items-center justify-end pb-2 cursor-pointer group">

            <i class="fa-solid fa-expand"></i>
        </div>

    </div>

    <div class="flex flex-col items-center pb-2 px-3 cursor-pointer hover:text-gray-600 transition-colors">
        <i class="fa-solid fa-wallet text-xl mb-1"></i>
        <span class="font-medium">บัญชี</span>
    </div>
    <div class="flex flex-col items-center pb-2 px-3 cursor-pointer hover:text-gray-600 transition-colors">
        <i class="fa-solid fa-user text-xl mb-1"></i>
        <span class="font-medium">โปรไฟล์</span>
    </div>
</div>

<!-- ================== JavaScript ฝั่ง Frontend ================== -->
<script>
    // 1. นำ Web App URL (GAS) ของคุณมาใส่ที่นี่
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1_a4EXwbMK2RoZ1-6GZ6QUXLTdFshQASP7EcdXAPnGOgmcZmJbbIHNh6SNtkK9k588Q/exec';
    
    // 2. นำ LIFF ID จาก LINE Developers มาใส่ที่นี่
    const LIFF_ID = '2012225566-hFrR9T1Q'; 

    // เริ่มต้นระบบ LIFF
    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('profileImage').src = profile.pictureUrl;
                
                // ดึงข้อมูล User จาก GAS API
                fetchUserData(profile.userId);
            } else {
                // หากยังไม่ได้ล็อกอิน ให้บังคับล็อกอินผ่าน LINE
                liff.login();
            }
        } catch (err) {
            console.error("LIFF Init Error:", err);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'ไม่สามารถเชื่อมต่อ LINE LIFF ได้ โปรดตรวจสอบ LIFF ID',
                confirmButtonColor: '#d33'
            });
        }
    }

    // ดึงข้อมูล User จาก GAS API
    async function fetchUserData(lineUserId) {
        Swal.fire({ 
            title: 'กำลังโหลดข้อมูล...', 
            allowOutsideClick: false, 
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            // เรียก API แบบ GET พร้อมส่ง Parameter ไปเช็คใน Sheet
            const response = await fetch(`${GAS_URL}?view=profile&lineUserId=${lineUserId}`);
            const data = await response.json();
            
            if(data.status === 'success') {
                // อัปเดต UI 
                document.getElementById('userName').innerText = data.name;
                document.getElementById('userRole').innerText = data.role;
                document.getElementById('netBalance').innerText = data.netBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('pendingDeduct').innerText = data.pendingDeduct.toLocaleString();
                document.getElementById('pbdCoins').innerText = data.pbdCoins.toLocaleString();

                // เช็คสิทธิ์ (RBAC) หากเป็นแอดมิน ให้แสดงเมนูตรวจคูปอง
                if (data.role === 'Activity_Admin' || data.role === 'Executive') {
                    const adminMenu = document.getElementById('menuAdminLog');
                    adminMenu.classList.remove('hidden');
                    adminMenu.classList.add('flex');
                }
                Swal.close();
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่พบผู้ใช้',
                    text: data.message,
                    confirmButtonColor: '#d33'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'การเชื่อมต่อฐานข้อมูลล้มเหลว (ตรวจสอบ URL GAS)',
                confirmButtonColor: '#d33'
            });
        }
    }

    // เปิด/ปิด แท็บคูปอง
    function openCoupons() {
        const section = document.getElementById('myCouponsSection');
        
        if (section.classList.contains('hidden')) {
            section.classList.remove('hidden');
            // เลื่อนหน้าจอลงมาที่แท็บคูปองอย่างนุ่มนวล
            section.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            section.classList.add('hidden');
        }
    }

    // กดใช้คูปองด้วย SweetAlert2
    function useCoupon(couponId) {
        Swal.fire({
            title: 'ยืนยันการใช้สิทธิ์?',
            text: "เมื่อกดยืนยันแล้ว คูปองจะถูกเปลี่ยนสถานะเป็น 'ใช้แล้ว' ทันที กรุณากดใช้ต่อหน้าพนักงานเท่านั้น!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6b7280',
            confirmButtonText: '<i class="fa-solid fa-check mr-1"></i> ยืนยันการใช้',
            cancelButtonText: 'ยกเลิก',
            reverseButtons: true
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ 
                    title: 'กำลังทำรายการ...', 
                    text: 'โปรดรอสักครู่',
                    allowOutsideClick: false, 
                    didOpen: () => { Swal.showLoading(); }
                });
                
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'use_coupon');
                    formData.append('couponId', couponId);

                    // ส่งข้อมูล POST ไปยัง GAS
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    const resData = await response.json();
                    
                    if (resData.status === 'success') {
                        Swal.fire({
                            icon: 'success',
                            title: 'ใช้สิทธิ์สำเร็จ!',
                            text: resData.message,
                            confirmButtonColor: '#10b981'
                        });
                        // ซ่อนหน้าคูปองหลังใช้สำเร็จ
                        openCoupons(); 
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'ไม่สามารถใช้สิทธิ์ได้',
                            text: resData.message,
                            confirmButtonColor: '#d33'
                        });
                    }
                } catch (err) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ข้อผิดพลาดระบบ',
                        text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้',
                        confirmButtonColor: '#d33'
                    });
                }
            }
        });
    }

    // เริ่มต้นการทำงานทันทีเมื่อโหลดหน้าเว็บเสร็จ
    window.onload = () => {
        // หมายเหตุ: หากต้องการทดสอบบนเบราว์เซอร์ปกติโดยไม่ผ่าน LINE 
        // ให้คอมเมนต์บรรทัดด้านล่างนี้ไว้ชั่วคราว แล้วจำลองเรียก fetchUserData('YOUR_LINE_USER_ID') แทน
        
        initializeLiff(); 
    };
</script>
